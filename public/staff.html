<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DevFest Montréal 2026 · Room Assignments</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --text: #1e1e1e;
    --muted: #5f6368;
    --border: #dfe3ea;
    --blue: #4285f4;
    --blue-bg: #e7f0fd;
    --peach-bg: #fdf0e6;
    --green: #34a853;
    --red: #ea4335;
    --yellow: #e37400;
    --pill: #eef1f6;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417;
      --surface: #1c2026;
      --text: #f0f2f5;
      --muted: #9aa3ad;
      --border: #2c333c;
      --blue-bg: #1d2a40;
      --peach-bg: #3a2a1d;
      --yellow: #fbbc04;
      --pill: #262d36;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417;
    --surface: #1c2026;
    --text: #f0f2f5;
    --muted: #9aa3ad;
    --border: #2c333c;
    --blue-bg: #1d2a40;
    --peach-bg: #3a2a1d;
    --yellow: #fbbc04;
    --pill: #262d36;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    font-size: 15px;
  }
  .safe { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: 10px;
  }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  .lang-toggle { display: inline-flex; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 2px; flex-shrink: 0; }
  .lang-btn { border: none; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .lang-btn[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .controls select {
    font: inherit;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    min-width: 0;
    flex: 1 1 200px;
  }
  .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

  .bulk-cal {
    border: 1px solid var(--green);
    background: rgba(52, 168, 83, 0.14);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .bulk-cal:hover { background: var(--green); color: #fff; }

  main {
    padding-top: 14px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 900px) {
    main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 1300px) {
    main { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  .room {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    align-self: start;
  }
  .room-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .room-head h2 { margin: 0; font-size: 16px; }
  .room-head .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .room.blue .room-head { background: var(--blue-bg); }
  .room.peach .room-head { background: var(--peach-bg); }

  .item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 3px;
  }
  .item:last-child { border-bottom: none; }
  .item .row1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .time {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 13px;
    background: var(--pill);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .session { font-weight: 600; }
  .loc { color: var(--text); font-size: 13px; }
  .loc-lbl { color: var(--green); font-weight: 700; }
  .speaker { color: var(--text); font-size: 14px; }
  .staff { font-size: 13px; color: var(--text); }
  .staff-val { color: var(--red); font-weight: 700; }
  .spk-lbl { color: var(--yellow); font-weight: 700; }
  .notes { color: var(--muted); font-size: 12px; }
  .unstaffed { color: var(--red); font-weight: 600; }
  .cal { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .cal-btn { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-decoration: none; cursor: pointer; }
  .cal-google { color: var(--blue); border-color: var(--blue); }
  .cal-apple { color: var(--text); }
  .hidden { display: none !important; }
  .empty { padding: 30px 16px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 0 max(16px, env(safe-area-inset-bottom)); }
</style>
</head>

<header class="safe">
  <div class="top-row">
    <div>
      <h1 id="pageTitle">DevFest Montréal 2026 · Room Assignments</h1>
      <div class="sub" id="pageSub">Friday 6 November 2026 · Espace Ax.c · Staff list</div>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language switcher">
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </div>
  <div class="controls">
    <select id="staffSelect" aria-label="Filter by staff member"></select>
    <select id="roomSelect" aria-label="Filter by room"></select>
  </div>
  <div class="bar-row">
    <div class="tabs" id="tabs" role="group" aria-label="Floor filter"></div>
    <button type="button" id="bulkIcsBtn" class="bulk-cal hidden"></button>
  </div>
</header>

<main id="grid" class="safe"></main>

  "Sega Genesis & Photo Booth": "Sega Genesis et cabine photo",
  "Registration & breakfast": "Inscription et déjeuner",
  "Registration": "Inscription",
  "Registration (until 13:00)": "Inscription (jusqu'à 13h00)",
  "Registration & sponsors": "Inscription et commanditaires",
  "Floating org helper (quarterback)": "Aide-organisateur volant (quarterback)",
  "Close 4th floor rooms": "Fermeture des salles du 4e étage",
  "Raffle caller, 4th floor": "Animation du tirage, 4e étage",
  "Raffle caller, 3rd floor": "Animation du tirage, 3e étage"
};
const NOTES_FR = {
  "We will regroup and dispatch tasks. Mr. Roboto setup: Kanastruk team.": "Nous nous regrouperons pour répartir les tâches. Installation de Mr. Roboto : équipe Kanastruk.",
  "Last staff in each 3rd floor room. We will regroup and dispatch tasks.": "Dernier bénévole dans chaque salle du 3e étage. Nous nous regrouperons pour répartir les tâches.",
  "3rd floor wrap-up after 18:30": "Rangement du 3e étage après 18h30",
  "Right after last talk at 14:40": "Juste après la dernière conférence à 14h40",
  "NADIA is practicing for her own DevFest a week later": "NADIA pratique pour son propre DevFest la semaine suivante",
  "NADIA is registration only": "NADIA est affectée uniquement à l'inscription",
  "Close to registration after his 13:00-14:00 photo booth shift": "Près de l'inscription après son quart de 13h00 à 14h00 à la cabine photo",
  "Helps across rooms all day": "Aide dans toutes les salles toute la journée",
  "Organizer task from the Organizers tab": "Tâche d'organisateur issue de l'onglet Organizers",
  "About 20 minutes": "Environ 20 minutes"
};

let locale = "en";

function localizeRoomName(n) { return locale === "fr" ? (ROOM_NAME_FR[n] || n) : n; }
function displayFloor(f) {
  if (locale === "fr") return ({ "3": "3e étage", "3rd floor": "3e étage", "4": "4e étage", "4th floor": "4e étage", "All": "Tous", "Entrance": "Entrée", "Downstairs": "En bas" })[f] || f;
  return ({ "3": "3rd floor", "4": "4th floor" })[f] || f;
}
function localizeItemLocation(room) {
  const dict = locale === "fr" ? LOCATIONS_FR : LOCATIONS_EN;
  if (dict[room.name]) return dict[room.name];
  const base = localizeRoomName(room.name);
  return base + (room.floor && room.floor !== "All" ? " (" + displayFloor(room.floor) + ")" : "");
}
function localizeTime(t) { return (locale === "fr" && /^After\s+18:30$/i.test(t.trim())) ? "Après 18h30" : t; }
function localizeSession(s) { return locale === "fr" ? (SESSION_FR[s] || s.replace(/\(workshop\)/gi, "(atelier)")) : s; }
function localizeSpeaker(sp) {
  if (locale === "en") return sp;
  if (sp === "Open") return "Ouvert";
  if (sp === "GDG Montreal Community Lounge") return "Salon communautaire GDG Montréal";
  return sp;
}
function localizeStaff(st) {
  if (locale === "en" || !st) return st;
  if (st === "Not staffed") return "Sans bénévole";
  return st
    .replace(/All staff \(dispatched on site\)/gi, "Toute l'équipe (répartie sur place)")
    .replace(/Kanastruk team/gi, "Équipe Kanastruk")
    .replace(/\(support until 16:00\)/gi, "(soutien jusqu'à 16h00)")
    .replace(/\(support\)/gi, "(soutien)")
    .replace(/\(main recorder\)/gi, "(enregistrement principal)")
    .replace(/\(OBS operator,\s*out 11:00 to 15:00\)/gi, "(opérateur OBS, absent de 11h00 à 15h00)")
    .replace(/\(OBS operator\)/gi, "(opérateur OBS)")
    .replace(/\(OBS support\)/gi, "(soutien OBS)")
    .replace(/\(sidekick\)/gi, "(acolyte)")
    .replace(/\(workshop attendee\)/gi, "(participant à l'atelier)")
    .replace(/\(recording\)/gi, "(enregistrement)")
    .replace(/\(lead\)/gi, "(responsable)")
    .replace(/\(last staff in room\)/gi, "(dernier bénévole en salle)")
    .replace(/\(organizers\)/gi, "(organisateurs)")
    .replace(/\(organizer\)/gi, "(organisateur/trice)")
    .replace(/Jhin is on talk/gi, "Jhin est en conférence");
}
function localizeNotes(no) { return (locale === "fr" && no) ? (NOTES_FR[no] || no) : no; }

const rooms = [];
const byName = {};
for (const r of ROWS) {
  const name = (r[0].includes("Danger Zone") || r[0].includes("Photo booth")) ? "Chill Zone, Photo booth & badge table (upstairs)" : r[0];
  if (!byName[name]) {
    byName[name] = { name, floor: name.includes("Sega") ? "3rd floor" : name.includes("Danger Zone") ? "4th floor" : (name.includes("Photo booth") ? "4th floor" : r[1]), seats: r[2], items: [] };
    rooms.push(byName[name]);
  }
  byName[name].items.push({ time: r[3], session: r[4], speaker: r[5], staff: r[6], notes: r[7] });
}

function startMin(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(t);
  return m ? (+m[1]) * 60 + (+m[2]) : 99999;
}
rooms.forEach(room => room.items.sort((a, b) => startMin(a.time) - startMin(b.time)));
const allRoomsItems = [
  { time: "07:00 - 08:30", session: "Setup", speaker: "", staff: "All staff (dispatched on site)", notes: "We will regroup and dispatch tasks. Mr. Roboto setup: Kanastruk team." },
  { time: "After 18:30", session: "Wrap-up (3rd floor)", speaker: "", staff: "All staff (dispatched on site)", notes: "Last staff in each 3rd floor room. We will regroup and dispatch tasks." }
];
rooms.forEach(room => {
  room.items = room.items.filter(it => !((it.time === "07:00 - 08:30" && it.session === "Setup") || it.time === "After 18:30"));
});
rooms.unshift({ name: "All rooms", floor: "All", seats: "", items: allRoomsItems });

function staffNames(s) {
  if (!s) return [];
  return s.replace(/\(.*?\)/g, "").split(",").map(p => p.trim()).filter(Boolean);
}
const SKIP_NAME = /^(all staff|not staffed|tbd|open)/i;
const peopleSet = new Set();
rooms.forEach(r => r.items.forEach(it => staffNames(it.staff).forEach(n => {
  if (!SKIP_NAME.test(n)) peopleSet.add(n.toUpperCase());
})));
const STAFF_NAMES = [...peopleSet].sort();

const floorOf = (f) => (f === "3" || f === "3rd floor" ? "3" : f === "4" || f === "4th floor" ? "4" : "other");
const grid = document.getElementById("grid");
const staffSelect = document.getElementById("staffSelect");
const roomSelect = document.getElementById("roomSelect");
const tabs = document.getElementById("tabs");
const bulkIcsBtn = document.getElementById("bulkIcsBtn");
let activeFloor = "all";

function rebuildControls() {
  const prevStaff = staffSelect.value || "all";
  const prevRoom = roomSelect.value || "all";
  staffSelect.innerHTML = "";
  staffSelect.add(new Option(locale === "fr" ? "Choisir une personne… (Tous les membres)" : "Choose a person… (All staff members)", "all"));
  STAFF_NAMES.forEach(name => {
    const label = (locale === "fr" && name === "KANASTRUK TEAM") ? "ÉQUIPE KANASTRUK" : name;
    staffSelect.add(new Option(label, name));
  });
  staffSelect.value = prevStaff;

  roomSelect.innerHTML = "";
  roomSelect.add(new Option(locale === "fr" ? "Toutes les salles" : "All rooms", "all"));
  rooms.forEach((r, i) => roomSelect.add(new Option(localizeRoomName(r.name), String(i))));
  roomSelect.value = prevRoom;

  tabs.innerHTML = "";
  [["all", locale === "fr" ? "Tous" : "All"], ["3", locale === "fr" ? "3e étage" : "3rd floor"], ["4", locale === "fr" ? "4e étage" : "4th floor"], ["other", locale === "fr" ? "Autre" : "Other"]].forEach(([key, label]) => {
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = label;
    b.dataset.floor = key;
    b.setAttribute("aria-pressed", key === activeFloor ? "true" : "false");
    b.addEventListener("click", () => {
      activeFloor = key;
      tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", t.dataset.floor === key ? "true" : "false"));
      render();
    });
    tabs.appendChild(b);
  });

  document.getElementById("pageTitle").textContent = locale === "fr"
    ? "DevFest Montréal 2026 · Affectations des salles"
    : "DevFest Montréal 2026 · Room Assignments";
  document.getElementById("pageSub").textContent = locale === "fr"
    ? "Vendredi 6 novembre 2026 · Espace Ax.c · Liste du staff"
    : "Friday 6 November 2026 · Espace Ax.c · Staff list";
  document.getElementById("pageFooter").textContent = locale === "fr"
    ? "Généré à partir de l'onglet Room Assignments de la feuille de planification. Heures locales (Montréal)."
    : "Built from the Room Assignments tab of the planning sheet. Times are local (Montréal).";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function staffHtml(s) {
  if (!s) return "";
  if (s === "Not staffed") return '<span class="unstaffed">' + (locale === "fr" ? "Sans bénévole" : "Not staffed") + '</span>';
  return esc(localizeStaff(s));
}

function parseRange(t) {
  const m = /^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/.exec(t);
  if (m) return [[+m[1], +m[2]], [+m[3], +m[4]]];
  if (/^After\s+18:30$/i.test(t.trim())) return [[18, 30], [19, 30]];
  return null;
}
function utcStamp(h, mi) {
  const d = new Date(Date.UTC(2026, 10, 6, h + 5, mi));
  return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
}
const CAL_LOCATION = "Espace Ax.c, 800 Rue du Square-Victoria, Montréal, QC";
function eventFields(it, roomName) {
  const r = parseRange(it.time);
  if (!r) return null;
  const activeStaff = staffSelect.value !== "all" ? staffSelect.value.toUpperCase() : "";
  const prefix = activeStaff ? "[DevFest Staff · " + activeStaff + "] " : "";
  const locRoom = localizeRoomName(roomName);
  const title = prefix + (localizeSession(it.session) || (locale === "fr" ? "Quart" : "Shift")) + " — " + locRoom;
  const details = [
    it.speaker && ((locale === "fr" ? "Conférencier(s): " : "Speaker: ") + localizeSpeaker(it.speaker)),
    it.staff && ((locale === "fr" ? "Équipe: " : "Staff: ") + localizeStaff(it.staff)),
    localizeNotes(it.notes)
  ].filter(Boolean).join("\n");
  return {
    title,
    start: utcStamp(r[0][0], r[0][1]),
    end: utcStamp(r[1][0], r[1][1]),
    location: CAL_LOCATION + " · " + locRoom,
    details
  };
}
function googleHref(f) {
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(f.title) +
    "&dates=" + f.start + "/" + f.end +
    "&location=" + encodeURIComponent(f.location) +
    "&details=" + encodeURIComponent(f.details) +
    "&ctz=America/Montreal";
}
function calButtons(it, roomName) {
  const f = eventFields(it, roomName);
  if (!f) return "";
  return '<div class="cal">' +
    '<a class="cal-btn cal-google" target="_blank" rel="noopener" href="' + esc(googleHref(f)) + '">+ Google</a>' +
    '<button type="button" class="cal-btn cal-apple" data-title="' + esc(f.title) + '" data-start="' + f.start +
    '" data-end="' + f.end + '" data-location="' + esc(f.location) + '" data-details="' + esc(f.details) + '">+ Apple / .ics</button>' +
    '</div>';
}
function icsEventBlock(f) {
  const e = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
  return [
    "BEGIN:VEVENT",
    "UID:" + Date.now() + "-" + Math.random().toString(36).slice(2) + "@devfest-mtl-2026",
    "DTSTAMP:" + now,
    "DTSTART:" + f.start,
    "DTEND:" + f.end,
    "SUMMARY:" + e(f.title),
    "LOCATION:" + e(f.location),
    "DESCRIPTION:" + e(f.details),
    "END:VEVENT"
  ].join("\r\n");
}
function icsText(events) {
  const list = Array.isArray(events) ? events : [events];
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//DevFest MTL 2026//Room Assignments//EN", "CALSCALE:GREGORIAN",
    ...list.map(icsEventBlock),
    "END:VCALENDAR"
  ].join("\r\n");
}
function downloadIcs(events, filenameBase) {
  const blob = new Blob([icsText(events)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (filenameBase || "devfest-shift").replace(/[^\w\-]+/g, "_").slice(0, 60) + ".ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let currentVisibleEvents = [];

function matchesStaff(staffStr, selectedStaff) {
  if (selectedStaff === "all") return true;
  if (!staffStr) return false;
  if (/all staff/i.test(staffStr)) return true;
  const names = staffNames(staffStr).map(n => n.toUpperCase());
  return names.includes(selectedStaff.toUpperCase());
}

function render() {
  const pickStaff = staffSelect.value;
  const pick = roomSelect.value;
  grid.innerHTML = "";
  currentVisibleEvents = [];

  if (pickStaff !== "all") {
    const list = [];
    rooms.forEach((room, idx) => {
      if (pick !== "all" && String(idx) !== pick) return;
      if (activeFloor !== "all" && floorOf(room.floor) !== activeFloor) return;
      room.items.forEach(it => {
        if (matchesStaff(it.staff, pickStaff)) list.push({ room, it });
      });
    });
    list.sort((a, b) => startMin(a.it.time) - startMin(b.it.time));
    list.forEach(({ room, it }) => {
      const ev = eventFields(it, room.name);
      if (ev) currentVisibleEvents.push(ev);
    });
    const sec = document.createElement("section");
    sec.className = "room blue";
    const dispStaff = (locale === "fr" && pickStaff === "KANASTRUK TEAM") ? "ÉQUIPE KANASTRUK" : pickStaff;
    sec.innerHTML =
      '<div class="room-head"><h2>' + esc(dispStaff) + '</h2><div class="meta">' + list.length + (locale === "fr" ? ' éléments' : ' items') + '</div></div>' +
      (list.length ? list.map(({ room, it }) =>
        '<div class="item">' +
          '<div class="row1"><span class="time">' + esc(localizeTime(it.time)) + '</span><span class="session">' + esc(localizeRoomName(room.name)) + '</span></div>' +
          (it.session ? '<div class="role">' + esc(localizeSession(it.session)) + '</div>' : '') +
          '<div class="loc"><strong class="loc-lbl">' + (locale === "fr" ? "Lieu : " : "Location: ") + '</strong>' + esc(localizeItemLocation(room)) + '</div>' +
          (it.speaker ? '<div class="speaker"><strong class="spk-lbl">' + (locale === "fr" ? "Conférencier(s) : " : "Speaker(s): ") + '</strong>' + esc(localizeSpeaker(it.speaker)) + '</div>' : '') +
          (it.staff ? '<div class="staff"><span class="staff-val">' + (locale === "fr" ? "Équipe : " : "Staff: ") + '</span>' + staffHtml(it.staff) + '</div>' : '') +
          (it.notes ? '<div class="notes">' + esc(localizeNotes(it.notes)) + '</div>' : '') +
          calButtons(it, room.name) +
        '</div>'
      ).join("") : '<div class="empty">' + (locale === "fr" ? "Aucun élément." : "No items.") + '</div>');
    grid.appendChild(sec);
  } else {
    let shown = 0;
    rooms.forEach((room, idx) => {
      if (pick !== "all" && String(idx) !== pick) return;
      if (activeFloor !== "all" && floorOf(room.floor) !== activeFloor) return;
      const items = room.items;
      if (!items.length) return;
      const colorClass = idx % 2 === 0 ? "blue" : "peach";
      const sec = document.createElement("section");
      sec.className = "room " + colorClass;
      sec.innerHTML =
        '<div class="room-head"><h2>' + esc(localizeRoomName(room.name)) + '</h2>' +
        '<div class="meta">' + esc(displayFloor(room.floor)) + (room.seats ? ' · ' + esc(room.seats) + (locale === "fr" ? ' places' : ' seats') : '') + '</div></div>' +
        items.map(it =>
          '<div class="item">' +
            '<div class="row1"><span class="time">' + esc(localizeTime(it.time)) + '</span>' +
            (it.session ? '<span class="session">' + esc(localizeSession(it.session)) + '</span>' : '') + '</div>' +
            '<div class="loc"><strong class="loc-lbl">' + (locale === "fr" ? "Lieu : " : "Location: ") + '</strong>' + esc(localizeItemLocation(room)) + '</div>' +
            (it.speaker ? '<div class="speaker"><strong class="spk-lbl">' + (locale === "fr" ? "Conférencier(s) : " : "Speaker(s): ") + '</strong>' + esc(localizeSpeaker(it.speaker)) + '</div>' : '') +
            (it.staff ? '<div class="staff"><span class="staff-val">' + (locale === "fr" ? "Équipe : " : "Staff: ") + '</span>' + staffHtml(it.staff) + '</div>' : '') +
            (it.notes ? '<div class="notes">' + esc(localizeNotes(it.notes)) + '</div>' : '') +
            calButtons(it, room.name) +
          '</div>'
        ).join("");
      grid.appendChild(sec);
      shown++;
    });
    if (!shown) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = locale === "fr" ? "Aucun résultat pour ce filtre." : "Nothing matches that filter.";
      grid.appendChild(e);
    }
  }

  if (pickStaff !== "all" && currentVisibleEvents.length > 0) {
    bulkIcsBtn.textContent = locale === "fr"
      ? "📅 Télécharger les " + currentVisibleEvents.length + " quarts de " + pickStaff.toUpperCase() + " (.ics)"
      : "📅 Download all " + currentVisibleEvents.length + " shifts for " + pickStaff.toUpperCase() + " (.ics)";
    bulkIcsBtn.classList.remove("hidden");
  } else {
    bulkIcsBtn.classList.add("hidden");
  }
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    locale = btn.dataset.lang;
    document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === locale ? "true" : "false"));
    rebuildControls();
    render();
  });
});

grid.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest(".cal-apple");
  if (!b) return;
  downloadIcs({
    title: b.dataset.title,
    start: b.dataset.start,
    end: b.dataset.end,
    location: b.dataset.location,
    details: b.dataset.details
  }, b.dataset.title);
});
bulkIcsBtn.addEventListener("click", () => {
  if (!currentVisibleEvents.length) return;
  const staffName = staffSelect.value !== "all" ? staffSelect.value.toUpperCase() : "staff";
  downloadIcs(currentVisibleEvents, "DevFest-2026-Shifts-" + staffName);
});
staffSelect.addEventListener("change", render);
roomSelect.addEventListener("change", render);
rebuildControls();
render();
</script>
</body>
</html>
