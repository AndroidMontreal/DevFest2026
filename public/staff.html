<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DevFest Montréal 2026 · Staff &amp; Room Assignments</title>
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --text: #1e1e1e;
    --muted: #5f6368;
    --border: #dfe3ea;
    --blue: #4285f4;
    --blue-bg: #e7f0fd;
    --peach-bg: #fdf0e6;
    --green: #34a853;
    --red: #ea4335;
    --yellow: #e37400;
    --pill: #eef1f6;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417;
      --surface: #1c2026;
      --text: #f0f2f5;
      --muted: #9aa3ad;
      --border: #2c333c;
      --blue-bg: #1d2a40;
      --peach-bg: #3a2a1d;
      --yellow: #fbbc04;
      --pill: #262d36;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417;
    --surface: #1c2026;
    --text: #f0f2f5;
    --muted: #9aa3ad;
    --border: #2c333c;
    --blue-bg: #1d2a40;
    --peach-bg: #3a2a1d;
    --yellow: #fbbc04;
    --pill: #262d36;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    font-size: 15px;
  }
  .safe { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: 10px;
  }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 13px; }
  .lang-toggle { display: inline-flex; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 2px; flex-shrink: 0; }
  .lang-btn { border: none; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .lang-btn[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .controls input, .controls select {
    font: inherit;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  .controls input { flex: 1 1 180px; }
  .controls select { flex: 1 1 180px; }
  .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

  .bulk-cal {
    border: 1px solid var(--green);
    background: rgba(52, 168, 83, 0.14);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .bulk-cal:hover { background: var(--green); color: #fff; }

  main {
    padding-top: 14px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 900px) {
    main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 1300px) {
    main { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  .room {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    align-self: start;
  }
  .room-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .room-head h2 { margin: 0; font-size: 16px; }
  .room-head .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .room.blue .room-head { background: var(--blue-bg); }
  .room.peach .room-head { background: var(--peach-bg); }

  .item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 3px;
  }
  .item:last-child { border-bottom: none; }
  .item .row1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .time {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 13px;
    background: var(--pill);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .session { font-weight: 600; }
  .loc { color: var(--text); font-size: 13.5px; }
  .loc-lbl { color: var(--green); font-weight: 700; }
  .speaker { color: var(--text); font-size: 14px; }
  .staff { font-size: 13px; color: var(--text); }
  .staff-val { color: var(--red); font-weight: 700; }
  .spk-lbl { color: var(--yellow); font-weight: 700; }
  .notes { color: var(--muted); font-size: 12px; }
  .unstaffed { color: var(--red); font-weight: 600; }
  .cal { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .cal-btn { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-decoration: none; cursor: pointer; }
  .cal-google { color: var(--blue); border-color: var(--blue); }
  .cal-apple { color: var(--text); }
  .hidden { display: none !important; }
  .empty { padding: 30px 16px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 0 max(16px, env(safe-area-inset-bottom)); }
</style>
</head>

<header class="safe">
  <div class="top-row">
    <div>
      <h1 id="pageTitle">DevFest Montréal 2026 · Staff &amp; Room Assignments</h1>

    </div>
    <div class="lang-toggle" role="group" aria-label="Language switcher">
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>
    </div>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search speaker, session or staff" aria-label="Search">
    <select id="staffSelect" aria-label="Filter by staff member"></select>
    <select id="roomSelect" aria-label="Filter by room"></select>

</header>

function displayFloor(f) {
  if (locale === "fr") return ({ "3": "3e étage", "4": "4e étage", "All": "Tous les étages" })[f] || f;
  return ({ "3": "3rd floor", "4": "4th floor", "All": "All floors" })[f] || f;
}
function localizeItemLocation(it) {
  if (it.session === "Close 4th floor rooms") {
    return locale === "fr" ? "Toutes les salles du 4e étage (4-1 à 4-7)" : "All 4th floor rooms (4-1 to 4-7)";
  }
  if (it.roomLocation === "Floating org helper") {
    return locale === "fr" ? "Toutes les salles (3e et 4e étages)" : "All rooms (3rd & 4th floors)";
  }
  const base = localizeRoomName(it.roomLocation);
  if (base.toLowerCase().includes("floor") || base.toLowerCase().includes("étage")) return base;
  const fl = displayFloor(it.floor);
  return fl ? base + " (" + fl + ")" : base;
}
function localizeTime(t) { return (locale === "fr" && /^After\s+18:30$/i.test(t.trim())) ? "Après 18h30" : t; }
function localizeSession(s) { return locale === "fr" ? (SESSION_FR[s] || s.replace(/\(workshop\)/gi, "(atelier)")) : s; }
function localizeSpeaker(sp) {
  if (locale === "en") return sp;
  if (sp === "Open") return "Ouvert";
  if (sp === "GDG Montreal Community Lounge") return "Salon communautaire GDG Montréal";
  return sp;
}
function localizeStaff(st) {
  if (locale === "en" || !st) return st;
  if (st === "Not staffed") return "Sans bénévole";
  return st
    .replace(/All staff \(dispatched on site\)/gi, "Toute l'équipe (répartie sur place)")
    .replace(/Kanastruk team/gi, "Équipe Kanastruk")
    .replace(/\(support until 16:00\)/gi, "(soutien jusqu'à 16h00)")
    .replace(/\(support\)/gi, "(soutien)")
    .replace(/\(main recorder\)/gi, "(enregistrement principal)")
    .replace(/\(OBS support\)/gi, "(soutien OBS)")
    .replace(/\(recording\)/gi, "(enregistrement)")
    .replace(/\(lead\)/gi, "(responsable)")
    .replace(/\(last staff in room\)/gi, "(dernier bénévole en salle)")
    .replace(/\(organizers\)/gi, "(organisateurs)")
    .replace(/\(organizer\)/gi, "(organisateur/trice)")
    .replace(/Jhin is on talk/gi, "Jhin est en conférence");
}
function localizeNotes(no) { return (locale === "fr" && no) ? (NOTES_FR[no] || no) : no; }

const rooms = [];
const byName = {};
for (const r of ROWS) {
  const name = (r[0].includes("Danger Zone") || r[0].includes("Photo booth & badge"))
    ? "4-1 · Chill Zone, Photo booth & badge table (4th floor)"
    : r[0];
  if (!byName[name]) {
    const floorCode = name.includes("Sega") || name.includes("Registration")
      ? "3"
      : (name.includes("Danger Zone") || name.includes("Photo booth"))
        ? "4"
        : r[1];
    byName[name] = { name, floor: floorCode, seats: r[2], items: [] };
    rooms.push(byName[name]);
  }
  byName[name].items.push({ roomLocation: r[0], time: r[3], session: r[4], speaker: r[5], staff: r[6], notes: r[7], floor: r[1] });
}

function startMin(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(t);
  return m ? (+m[1]) * 60 + (+m[2]) : 99999;
}
rooms.forEach(room => room.items.sort((a, b) => startMin(a.time) - startMin(b.time)));
const floorOf = (f) => (f === "3" ? "3" : f === "4" ? "4" : "other");
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const staffSelect = document.getElementById("staffSelect");
const roomSelect = document.getElementById("roomSelect");
const tabs = document.getElementById("tabs");
const bulkIcsBtn = document.getElementById("bulkIcsBtn");
let activeFloor = "all";

const STAFF_NAMES = [
  "ALI", "ANDY", "ARUNESH", "BILLY", "BRIJ-PAUL", "DANIEL TO", "DANIEL WEI",
  "FLORIAN", "JERWIN", "JESSY", "JHIN", "JIHOO", "KHASHAYAR", "Kanastruk team",
  "LENZ", "LUNE", "MIMOH", "NADIA", "NAV", "OUMAIMA", "REBECCA", "SAJAD", "SAMUEL",
  "SARA", "SOUAD", "STEFANIA", "WANLIN", "WILSON", "YANIS"
];

function rebuildControls() {
  const prevStaff = staffSelect.value || "all";
  const prevRoom = roomSelect.value || "all";
  staffSelect.innerHTML = "";
  staffSelect.add(new Option(locale === "fr" ? "Tous les membres de l'équipe" : "All staff members", "all"));
  STAFF_NAMES.forEach(name => {
    const label = locale === "fr"
      ? "Équipe : " + (name === "Kanastruk team" ? "Équipe Kanastruk" : name)
      : "Staff: " + name;
    staffSelect.add(new Option(label, name.toLowerCase()));
  });
  staffSelect.value = prevStaff;

  roomSelect.innerHTML = "";
  roomSelect.add(new Option(locale === "fr" ? "Toutes les salles" : "All rooms", "all"));
  rooms.forEach((r, i) => roomSelect.add(new Option(localizeRoomName(r.name), String(i))));
  roomSelect.value = prevRoom;

  tabs.innerHTML = "";
  [["all", locale === "fr" ? "Tous" : "All"], ["3", locale === "fr" ? "3e étage" : "3rd floor"], ["4", locale === "fr" ? "4e étage" : "4th floor"], ["other", locale === "fr" ? "Autre" : "Other"]].forEach(([key, label]) => {
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = label;
    b.dataset.floor = key;
    b.setAttribute("aria-pressed", key === activeFloor ? "true" : "false");
    b.addEventListener("click", () => {
      activeFloor = key;
      tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", t.dataset.floor === key ? "true" : "false"));
      render();
    });
    tabs.appendChild(b);
  });

  document.getElementById("pageTitle").textContent = locale === "fr"
    ? "DevFest Montréal 2026 · Affectations par salle (Équipe)"
    : "DevFest Montréal 2026 · Staff & Room Assignments";
  document.getElementById("pageSub").textContent = locale === "fr"
    ? "Vendredi 6 novembre 2026 · Espace Ax.c (800 Square-Victoria) · Vue chronologique par salle"
    : "Friday 6 November 2026 · Espace Ax.c (800 Square-Victoria) · Chronological view by room";
  search.placeholder = locale === "fr"
    ? "Rechercher un conférencier, une session ou un bénévole"
    : "Search speaker, session or staff";
  document.getElementById("pageFooter").textContent = locale === "fr"
    ? "Généré à partir de l'onglet Room Assignments de la feuille de planification. Heures locales (Montréal)."
    : "Built from the Room Assignments tab of the planning sheet. Times are local (Montréal).";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function staffHtml(s) {
  if (!s) return "";
  if (s === "Not staffed") return '<span class="unstaffed">' + (locale === "fr" ? "Sans bénévole" : "Not staffed") + '</span>';
  return esc(localizeStaff(s));
}

function parseRange(t) {
  const m = /^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/.exec(t);
  if (m) return [[+m[1], +m[2]], [+m[3], +m[4]]];
  if (/^After\s+18:30$/i.test(t.trim())) return [[18, 30], [19, 30]];
  return null;
}
function utcStamp(h, mi) {
  const d = new Date(Date.UTC(2026, 10, 6, h + 5, mi));
  return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
}
const CAL_LOCATION = "Espace Ax.c, 800 Rue du Square-Victoria, Montréal, QC";
function eventFields(it) {
  const r = parseRange(it.time);
  if (!r) return null;
  const activeStaff = staffSelect.value !== "all" ? staffSelect.value.toUpperCase() : "";
  const prefix = activeStaff ? "[DevFest Staff · " + activeStaff + "] " : "[DevFest Staff] ";
  const locRoom = localizeItemLocation(it);
  const title = prefix + (localizeSession(it.session) || (locale === "fr" ? "Quart" : "Shift")) + " — " + locRoom;
  const details = [
    (locale === "fr" ? "Lieu: " : "Location: ") + locRoom,
    it.speaker && ((locale === "fr" ? "Conférencier(s): " : "Speaker: ") + localizeSpeaker(it.speaker)),
    it.staff && ((locale === "fr" ? "Équipe: " : "Staff: ") + localizeStaff(it.staff)),
    localizeNotes(it.notes)
  ].filter(Boolean).join("\n");
  return {
    title,
    start: utcStamp(r[0][0], r[0][1]),
    end: utcStamp(r[1][0], r[1][1]),
    location: CAL_LOCATION + " · " + locRoom,
    details
  };
}
function googleHref(f) {
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(f.title) +
    "&dates=" + f.start + "/" + f.end +
    "&location=" + encodeURIComponent(f.location) +
    "&details=" + encodeURIComponent(f.details) +
    "&ctz=America/Montreal";
}
function calButtons(it) {
  const f = eventFields(it);
  if (!f) return "";
  return '<div class="cal">' +
    '<a class="cal-btn cal-google" target="_blank" rel="noopener" href="' + esc(googleHref(f)) + '">+ Google</a>' +
    '<button type="button" class="cal-btn cal-apple" data-title="' + esc(f.title) + '" data-start="' + f.start +
    '" data-end="' + f.end + '" data-location="' + esc(f.location) + '" data-details="' + esc(f.details) + '">+ Apple / .ics</button>' +
    '</div>';
}
function icsEventBlock(f) {
  const e = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
  return [
    "BEGIN:VEVENT",
    "UID:" + Date.now() + "-" + Math.random().toString(36).slice(2) + "@devfest-mtl-2026",
    "DTSTAMP:" + now,
    "DTSTART:" + f.start,
    "DTEND:" + f.end,
    "SUMMARY:" + e(f.title),
    "LOCATION:" + e(f.location),
    "DESCRIPTION:" + e(f.details),
    "END:VEVENT"
  ].join("\r\n");
}
function icsText(events) {
  const list = Array.isArray(events) ? events : [events];
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//DevFest MTL 2026//Room Assignments//EN", "CALSCALE:GREGORIAN",
    ...list.map(icsEventBlock),
    "END:VCALENDAR"
  ].join("\r\n");
}
function downloadIcs(events, filenameBase) {
  const blob = new Blob([icsText(events)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (filenameBase || "devfest-shift").replace(/[^\w\-]+/g, "_").slice(0, 60) + ".ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let currentVisibleEvents = [];

function matchesStaff(staffStr, selectedStaff) {
  if (selectedStaff === "all") return true;
  if (!staffStr) return false;
  const lower = staffStr.toLowerCase();
  if (lower.includes("all staff")) return true;
  const escaped = selectedStaff.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z])" + escaped + "([^a-z]|$)", "i").test(lower);
}

function render() {
  const q = search.value.trim().toLowerCase();
  const pickStaff = staffSelect.value;
  const pick = roomSelect.value;
  grid.innerHTML = "";
  currentVisibleEvents = [];
  let shown = 0;
  rooms.forEach((room, idx) => {
    if (pick !== "all" && String(idx) !== pick) return;

    const items = room.items.filter(it => {
      if (activeFloor !== "all" && floorOf(room.floor) !== activeFloor && floorOf(it.floor) !== activeFloor) return false;
      if (!matchesStaff(it.staff, pickStaff)) return false;
      if (!q) return true;
      const hay = [room.name, localizeRoomName(room.name), it.roomLocation, localizeItemLocation(it), it.time, localizeTime(it.time), it.session, localizeSession(it.session), it.speaker, it.staff, localizeStaff(it.staff), it.notes, localizeNotes(it.notes)].join(" ").toLowerCase();
      return hay.includes(q);
    });
    if (!items.length) return;

    items.forEach(it => {
      const ev = eventFields(it);
      if (ev) currentVisibleEvents.push(ev);
    });

    const colorClass = idx % 2 === 0 ? "blue" : "peach";
    const sec = document.createElement("section");
    sec.className = "room " + colorClass;
    sec.innerHTML =
      '<div class="room-head"><h2>' + esc(localizeRoomName(room.name)) + '</h2>' +
      '<div class="meta">' + esc(displayFloor(room.floor)) + (room.seats ? ' · ' + esc(room.seats) + (locale === "fr" ? ' places' : ' seats') : '') + '</div></div>' +
      items.map(it =>
        '<div class="item">' +
          '<div class="row1"><span class="time">' + esc(localizeTime(it.time)) + '</span>' +
          (it.session ? '<span class="session">' + esc(localizeSession(it.session)) + '</span>' : '') + '</div>' +
          '<div class="loc"><strong class="loc-lbl">' + (locale === "fr" ? "Lieu : " : "Location: ") + '</strong>' + esc(localizeItemLocation(it)) + '</div>' +
          (it.speaker ? '<div class="speaker"><strong class="spk-lbl">' + (locale === "fr" ? "Conférenciers : " : "Speakers: ") + '</strong>' + esc(localizeSpeaker(it.speaker)) + '</div>' : '') +
          (it.staff ? '<div class="staff"><span class="staff-val">' + (locale === "fr" ? "Équipe : " : "Staff: ") + '</span>' + staffHtml(it.staff) + '</div>' : '') +
          (it.notes ? '<div class="notes">' + esc(localizeNotes(it.notes)) + '</div>' : '') +
          calButtons(it) +
        '</div>'
      ).join("");
    grid.appendChild(sec);
    shown++;
  });

  if (pickStaff !== "all" && currentVisibleEvents.length > 0) {
    bulkIcsBtn.textContent = locale === "fr"
      ? "📅 Télécharger les " + currentVisibleEvents.length + " quarts de " + pickStaff.toUpperCase() + " (.ics)"
      : "📅 Download all " + currentVisibleEvents.length + " shifts for " + pickStaff.toUpperCase() + " (.ics)";
    bulkIcsBtn.classList.remove("hidden");
  } else {
    bulkIcsBtn.classList.add("hidden");
  }

  if (!shown) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = locale === "fr" ? "Aucun résultat pour cette recherche." : "Nothing matches that filter.";
    grid.appendChild(e);
  }
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    locale = btn.dataset.lang;
    document.querySelectorAll(".lang-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === locale ? "true" : "false"));
    rebuildControls();
    render();
  });
});

grid.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest(".cal-apple");
  if (!b) return;
  downloadIcs({
    title: b.dataset.title,
    start: b.dataset.start,
    end: b.dataset.end,
    location: b.dataset.location,
    details: b.dataset.details
  }, b.dataset.title);
});
bulkIcsBtn.addEventListener("click", () => {
  if (!currentVisibleEvents.length) return;
  const staffName = staffSelect.value !== "all" ? staffSelect.value.toUpperCase() : "staff";
  downloadIcs(currentVisibleEvents, "DevFest-2026-Shifts-" + staffName);
});
search.addEventListener("input", render);
staffSelect.addEventListener("change", render);
roomSelect.addEventListener("change", render);
rebuildControls();
render();
</script>
</body>
</html>
